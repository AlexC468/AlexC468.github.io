<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <!-- Linking our external CSS stylesheet for styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section: Main title and navigation -->
    <header>
        <h1 id="main-title">Welcome to My Personal Space!</h1>
        <p>A web page built from scratch with HTML, CSS, and JS.</p>
    </header>

    <!-- Main Content Area -->
    <main>
        <section class="card">
            <h2>About Me</h2>
            <p>Hi! I'm an aspiring developer learning how to build and host web projects.</p>
        </section>

        <section class="card">
            <h2>Interactive Feature</h2>
            <p>Click the button below to see JavaScript in action!</p>
            <!-- Button that triggers our JavaScript function -->
            <button id="interactive-btn">Click Me!</button>
            <p id="message-display"></p>
        </section>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 Built with pride on GitHub Pages</p>
    </footer>

    <!-- Linking our external JavaScript file (placed at bottom so HTML loads first) -->
    <script src="script.js"></script>
</body>
</html>
